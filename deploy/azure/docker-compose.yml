# The study deployment: the app, and a reverse proxy that terminates TLS.
#
# The database is a bind mount onto the VM's own ext4 disk, which is the whole
# reason this runs on a VM rather than on App Service. SQLite wants a real
# block device; App Service's persistent storage is an SMB share, and SQLite
# over SMB is the documented way to corrupt a database file.

services:
  app:
    image: ${APP_IMAGE:?set APP_IMAGE in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      # Real disk, real POSIX locking.
      DATABASE_URL: file:/data/dev.db
      TECTONIC_CACHE_DIR: /data/tectonic-cache
      # Auth.js sits behind Caddy, so it has to trust the forwarded headers to
      # build correct callback URLs instead of localhost ones.
      AUTH_TRUST_HOST: "true"
      PORT: "3000"
    volumes:
      - ./data:/data
    expose:
      - "3000"
    # Not published to the host: the only way in is through Caddy, so there is
    # no plain-HTTP port sitting open on the public IP beside the TLS one.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - app

volumes:
  # Certificates live in a named volume so a compose restart does not throw
  # away a valid certificate and re-request one; Let's Encrypt rate-limits
  # repeat issuance, and running into that mid-study would take the site down.
  caddy_data:
  caddy_config:
  caddy_logs:
